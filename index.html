<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GameHub — Central de Jogos</title>
<meta name="description" content="Central de jogos: pesquise por nome, plataforma, categoria ou código único e baixe direto." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ===== TOPBAR / MENU ===== -->
<header class="topbar">
  <div class="topbar-inner">
    <button id="themeBtn" class="icon-btn" title="Alternar tema">🌙</button>

    <a class="brand" href="#">
      <img id="logoSquare" class="logo-square" alt="Logo" hidden />
      <img id="logoWord" class="logo-word" alt="Logo escrita" hidden />
      <span id="brandFallback" class="brand-fallback">GameHub</span>
    </a>

    <nav id="menuBar" class="menu"></nav>

    <button id="helpBtn" class="icon-btn help" title="Ajuda">?</button>
    <button id="burger" class="icon-btn burger" title="Menu">☰</button>
  </div>
  <nav id="menuMobile" class="menu-mobile"></nav>
</header>

<main class="container">

  <!-- ===== BUSCA + FILTROS ===== -->
  <section class="searchbar">
    <input id="search" type="search" placeholder="Pesquisar por nome, plataforma, categoria ou código único..." />
    <div class="filters">
      <select id="filterCategory"><option value="">Todas as categorias</option></select>
      <select id="filterPlatform"><option value="">Todas as plataformas</option></select>
      <select id="sort">
        <option value="az">Nome (A → Z)</option>
        <option value="za">Nome (Z → A)</option>
        <option value="sizeDesc">Tamanho (maior → menor)</option>
        <option value="sizeAsc">Tamanho (menor → maior)</option>
      </select>
      <button id="viewBtn" class="ghost-btn" title="Alternar mosaico/lista">▦ Mosaico</button>
    </div>
  </section>

  <!-- ===== GRID ===== -->
  <section id="grid" class="grid mosaic"></section>
  <p id="empty" class="empty" hidden>Nenhum jogo encontrado.</p>

  <!-- ===== PAGINAÇÃO ===== -->
  <nav id="pagination" class="pagination"></nav>
</main>

<!-- ===== RODAPÉ ===== -->
<footer class="footer">
  <div class="footer-inner">
    <div>
      <h4>Links úteis</h4>
      <ul id="footerLinks" class="footer-links"></ul>
    </div>
    <div>
      <h4>Atribuição</h4>
      <p id="footerAttribution" class="muted"></p>
    </div>
  </div>
</footer>

<!-- botão discreto admin -->
<button id="adminDot" class="admin-dot" title="Admin">•</button>

<!-- ===== MODAL JOGO ===== -->
<div id="gameModal" class="overlay" hidden>
  <div class="modal">
    <button class="x" data-close>✕</button>
    <div class="game-modal">
      <img id="gmCover" class="gm-cover" alt="Capa do jogo" />
      <div class="gm-info">
        <h2 id="gmTitle"></h2>
        <div id="gmTags" class="tags"></div>
        <p id="gmDesc" class="muted"></p>
        <dl class="meta">
          <div><dt>Plataforma</dt><dd id="gmPlatform"></dd></div>
          <div><dt>Categoria</dt><dd id="gmCategory"></dd></div>
          <div><dt>Código</dt><dd id="gmCode"></dd></div>
          <div><dt>Tamanho</dt><dd id="gmSize"></dd></div>
        </dl>
        <a id="gmDownload" class="primary-btn" href="#">⬇ Baixar agora</a>
      </div>
    </div>
  </div>
</div>

<!-- ===== MODAL AJUDA ===== -->
<div id="helpModal" class="overlay" hidden>
  <div class="modal narrow">
    <button class="x" data-close>✕</button>
    <h2>Como funciona</h2>
    <div id="helpContent" class="help-content muted"></div>
  </div>
</div>

<!-- ===== MODAL LOGIN ===== -->
<div id="loginModal" class="overlay" hidden>
  <div class="modal tiny">
    <button class="x" data-close>✕</button>
    <h2>Acesso restrito</h2>
    <form id="loginForm" class="form">
      <input id="loginEmail" type="email" placeholder="E-mail" required />
      <input id="loginPass" type="password" placeholder="Senha" required />
      <button class="primary-btn" type="submit">Entrar</button>
      <p id="loginError" class="error"></p>
    </form>
  </div>
</div>

<!-- ===== MODAL ADMIN ===== -->
<div id="adminModal" class="overlay" hidden>
  <div class="modal wide">
    <button class="x" data-close>✕</button>
    <div class="admin-head">
      <h2>Painel do administrador</h2>
      <button id="logoutBtn" class="ghost-btn">Sair</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="games">Jogos</button>
      <button class="tab" data-tab="menu">Menu</button>
      <button class="tab" data-tab="footer">Rodapé</button>
      <button class="tab" data-tab="help">Ajuda</button>
      <button class="tab" data-tab="theme">Aparência</button>
    </div>

    <!-- JOGOS -->
    <section class="panel active" data-panel="games">
      <form id="gameForm" class="form grid2">
        <input type="hidden" id="gameId" />
        <input id="gTitle" placeholder="Título" required />
        <input id="gPlatform" placeholder="Plataforma" required />
        <input id="gCategory" placeholder="Categoria" required />
        <input id="gCode" placeholder="Código único" required />
        <div class="row">
          <input id="gSize" type="number" step="0.01" placeholder="Tamanho" required />
          <select id="gUnit"><option value="MB">MB</option><option value="GB">GB</option></select>
        </div>
        <input id="gDownload" placeholder="Link de download direto (archive.org)" required />
        <textarea id="gDesc" placeholder="Descrição" rows="3" class="span2"></textarea>
        <input id="gCoverUrl" placeholder="Capa por link externo (https://...)" class="span2" />
        <div class="span2 row">
          <input id="gCoverFile" type="file" accept="image/*" />
          <span class="muted small">Upload é convertido em base64 (Realtime Database)</span>
        </div>
        <div class="span2 row">
          <button class="primary-btn" type="submit">Salvar jogo</button>
          <button type="button" id="gameReset" class="ghost-btn">Limpar</button>
        </div>
      </form>
      <div id="adminGames" class="admin-list"></div>
    </section>

    <!-- MENU -->
    <section class="panel" data-panel="menu">
      <form id="menuForm" class="form row">
        <input id="mLabel" placeholder="Nome do item" required />
        <input id="mUrl" placeholder="Link (https://... ou #)" required />
        <button class="primary-btn" type="submit">Adicionar</button>
      </form>
      <div id="adminMenu" class="admin-list"></div>
    </section>

    <!-- RODAPÉ -->
    <section class="panel" data-panel="footer">
      <form id="linkForm" class="form row">
        <input id="lLabel" placeholder="Nome do link" required />
        <input id="lUrl" placeholder="URL" required />
        <button class="primary-btn" type="submit">Adicionar</button>
      </form>
      <div id="adminLinks" class="admin-list"></div>
      <form id="attrForm" class="form">
        <textarea id="attrText" rows="3" placeholder="Texto de atribuição"></textarea>
        <button class="primary-btn" type="submit">Salvar atribuição</button>
      </form>
    </section>

    <!-- AJUDA -->
    <section class="panel" data-panel="help">
      <form id="helpForm" class="form">
        <textarea id="helpText" rows="10" placeholder="Explique como o site funciona (uma linha por parágrafo)"></textarea>
        <button class="primary-btn" type="submit">Salvar ajuda</button>
      </form>
    </section>

    <!-- APARÊNCIA -->
    <section class="panel" data-panel="theme">
      <form id="themeForm" class="form grid2">
        <label>Nome do site<input id="tSiteName" /></label>
        <label>Cor de destaque<input id="tAccent" type="color" /></label>
        <label>Fundo (escuro)<input id="tBgDark" type="color" /></label>
        <label>Fundo (claro)<input id="tBgLight" type="color" /></label>
        <label>Raio das bordas (px)<input id="tRadius" type="number" min="0" max="40" /></label>
        <label>Logo quadrada 1:1 (link)<input id="tLogoSquare" placeholder="https://..." /></label>
        <label>Logo escrita (link)<input id="tLogoWord" placeholder="https://..." /></label>
        <label>Upload logo quadrada<input id="tLogoSquareFile" type="file" accept="image/*" /></label>
        <label>Upload logo escrita<input id="tLogoWordFile" type="file" accept="image/*" /></label>
        <div class="span2"><button class="primary-btn" type="submit">Salvar aparência</button></div>
      </form>
    </section>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
